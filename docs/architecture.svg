<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    <linearGradient id="layerA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="layerB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="layerC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1B2E"/>
      <stop offset="100%" stop-color="#171425"/>
    </linearGradient>
    <linearGradient id="layerD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14212A"/>
      <stop offset="100%" stop-color="#0F1A22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#21C55D"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF4B4B"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="60" fill="#FAFAFA" font-size="30" font-weight="700" text-anchor="middle">AI-Driven Business Ops — Unified Architecture</text>
  <text x="800" y="90" fill="#9BA0AB" font-size="14" text-anchor="middle">Resilient ingestion · Intelligent triage · Autonomous agents with guardrails</text>

  <!-- ============ LAYER 1: SOURCES ============ -->
  <rect x="60" y="140" width="1480" height="140" rx="14" fill="url(#layerA)" stroke="#2F323A"/>
  <text x="90" y="175" fill="#9BA0AB" font-size="12" font-weight="600" letter-spacing="1.5">DATA SOURCES &amp; CHANNELS</text>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="110" y="195" width="180" height="60" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="200" y="230" fill="#FAFAFA">ERP</text>

    <rect x="320" y="195" width="180" height="60" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="410" y="230" fill="#FAFAFA">E-commerce</text>

    <rect x="530" y="195" width="180" height="60" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="620" y="230" fill="#FAFAFA">Gmail / IMAP</text>

    <rect x="740" y="195" width="180" height="60" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="830" y="230" fill="#FAFAFA">Zendesk</text>

    <rect x="950" y="195" width="180" height="60" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="1040" y="230" fill="#FAFAFA">Intercom</text>

    <rect x="1160" y="195" width="180" height="60" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="1250" y="230" fill="#FAFAFA">Carriers</text>
  </g>

  <!-- Arrow layer1 -> layer2 -->
  <line x1="800" y1="280" x2="800" y2="330" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 2: INGESTION ============ -->
  <rect x="60" y="340" width="1480" height="160" rx="14" fill="url(#layerB)" stroke="#2F323A"/>
  <text x="90" y="375" fill="#9BA0AB" font-size="12" font-weight="600" letter-spacing="1.5">INGESTION · RESILIENCE · MESSAGING</text>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="110" y="400" width="260" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="240" y="432" fill="#FAFAFA">FastAPI Webhooks</text>
    <text x="240" y="452" fill="#9BA0AB" font-size="11" font-weight="400">/webhooks/zendesk</text>

    <rect x="410" y="400" width="260" height="70" rx="10" fill="#262730" stroke="#21C55D"/>
    <text x="540" y="432" fill="#FAFAFA">Transactional Outbox</text>
    <text x="540" y="452" fill="#21C55D" font-size="11" font-weight="400">consistency + idempotency</text>

    <rect x="710" y="400" width="260" height="70" rx="10" fill="#262730" stroke="#FF4B4B"/>
    <text x="840" y="432" fill="#FAFAFA">RabbitMQ</text>
    <text x="840" y="452" fill="#FF4B4B" font-size="11" font-weight="400">topic exchange · durable</text>

    <rect x="1010" y="400" width="260" height="70" rx="10" fill="#262730" stroke="#F59E0B"/>
    <text x="1140" y="432" fill="#FAFAFA">Dead Letter Queue</text>
    <text x="1140" y="452" fill="#F59E0B" font-size="11" font-weight="400">exponential backoff</text>

    <rect x="1310" y="400" width="200" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="1410" y="432" fill="#FAFAFA">Idempotency Keys</text>
    <text x="1410" y="452" fill="#9BA0AB" font-size="11" font-weight="400">processed_messages</text>
  </g>

  <!-- Arrows inside layer 2 -->
  <line x1="370" y1="435" x2="410" y2="435" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="435" x2="710" y2="435" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="435" x2="1010" y2="435" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1270" y1="435" x2="1310" y2="435" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow layer2 -> layer3 -->
  <line x1="800" y1="500" x2="800" y2="560" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 3: AI ENGINES (3 modules) ============ -->
  <rect x="60" y="570" width="1480" height="260" rx="14" fill="url(#layerC)" stroke="#2F323A"/>
  <text x="90" y="605" fill="#9BA0AB" font-size="12" font-weight="600" letter-spacing="1.5">AI &amp; ANALYTICS ENGINES</text>

  <!-- Module A -->
  <g>
    <rect x="100" y="630" width="440" height="180" rx="12" fill="#262730" stroke="#3D4048"/>
    <rect x="100" y="630" width="440" height="36" rx="12" fill="#312E81"/>
    <text x="120" y="654" fill="#FAFAFA" font-size="14" font-weight="700">Module A — Margin Simulator</text>

    <text x="120" y="690" fill="#9BA0AB" font-size="12">ETL: pandas / Polars</text>
    <text x="120" y="710" fill="#9BA0AB" font-size="12">ML: Scikit-learn · elasticity</text>
    <text x="120" y="730" fill="#9BA0AB" font-size="12">Monte Carlo: 5,000 simulations</text>
    <text x="120" y="750" fill="#9BA0AB" font-size="12">Output: P10 / P50 / P90 profit</text>
    <rect x="120" y="765" width="140" height="26" rx="6" fill="#1F2937" stroke="#4B5563"/>
    <text x="190" y="783" fill="#D1D5DB" font-size="11" text-anchor="middle">Streamlit</text>
    <rect x="270" y="765" width="140" height="26" rx="6" fill="#1F2937" stroke="#4B5563"/>
    <text x="340" y="783" fill="#D1D5DB" font-size="11" text-anchor="middle">Power BI</text>
  </g>

  <!-- Module B -->
  <g>
    <rect x="580" y="630" width="440" height="180" rx="12" fill="#262730" stroke="#3D4048"/>
    <rect x="580" y="630" width="440" height="36" rx="12" fill="#166534"/>
    <text x="600" y="654" fill="#FAFAFA" font-size="14" font-weight="700">Module B — Triage Pipeline</text>

    <text x="600" y="690" fill="#9BA0AB" font-size="12">Gemini 2.5 Flash via google-genai</text>
    <text x="600" y="710" fill="#9BA0AB" font-size="12">Structured Outputs (JSON Schema)</text>
    <text x="600" y="730" fill="#9BA0AB" font-size="12">Extraction: intent · urgency · sentiment</text>
    <text x="600" y="750" fill="#9BA0AB" font-size="12">Intelligent queue routing</text>
    <rect x="600" y="765" width="140" height="26" rx="6" fill="#1F2937" stroke="#4B5563"/>
    <text x="670" y="783" fill="#D1D5DB" font-size="11" text-anchor="middle">FRT ↓ ~85%</text>
    <rect x="750" y="765" width="140" height="26" rx="6" fill="#1F2937" stroke="#4B5563"/>
    <text x="820" y="783" fill="#D1D5DB" font-size="11" text-anchor="middle">Deterministic</text>
  </g>

  <!-- Module C -->
  <g>
    <rect x="1060" y="630" width="440" height="180" rx="12" fill="#262730" stroke="#3D4048"/>
    <rect x="1060" y="630" width="440" height="36" rx="12" fill="#7C2D12"/>
    <text x="1080" y="654" fill="#FAFAFA" font-size="14" font-weight="700">Module C — Autonomous Agent</text>

    <text x="1080" y="690" fill="#9BA0AB" font-size="12">ReAct · Function Calling</text>
    <text x="1080" y="710" fill="#9BA0AB" font-size="12">RAG: pgvector (policies + manuals)</text>
    <text x="1080" y="730" fill="#9BA0AB" font-size="12">Tools: lookup · label · refund · coupon</text>
    <text x="1080" y="750" fill="#9BA0AB" font-size="12">Guardrails + Human-in-the-Loop</text>
    <rect x="1080" y="765" width="140" height="26" rx="6" fill="#1F2937" stroke="#4B5563"/>
    <text x="1150" y="783" fill="#D1D5DB" font-size="11" text-anchor="middle">Full tracing</text>
    <rect x="1230" y="765" width="140" height="26" rx="6" fill="#1F2937" stroke="#F59E0B"/>
    <text x="1300" y="783" fill="#F59E0B" font-size="11" text-anchor="middle">HITL &gt; R$200</text>
  </g>

  <!-- Arrows layer3 -> layer4 -->
  <line x1="320" y1="830" x2="320" y2="890" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="830" x2="800" y2="890" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1280" y1="830" x2="1280" y2="890" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 4: ACTION & OBSERVABILITY ============ -->
  <rect x="60" y="900" width="1480" height="160" rx="14" fill="url(#layerD)" stroke="#2F323A"/>
  <text x="90" y="935" fill="#9BA0AB" font-size="12" font-weight="600" letter-spacing="1.5">ACTION · OBSERVABILITY · DATA</text>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="110" y="960" width="230" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="225" y="992" fill="#FAFAFA">External APIs</text>
    <text x="225" y="1012" fill="#9BA0AB" font-size="11" font-weight="400">ERP · carriers</text>

    <rect x="360" y="960" width="230" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="475" y="992" fill="#FAFAFA">PostgreSQL</text>
    <text x="475" y="1012" fill="#9BA0AB" font-size="11" font-weight="400">+ pgvector</text>

    <rect x="610" y="960" width="230" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="725" y="992" fill="#FAFAFA">Prometheus</text>
    <text x="725" y="1012" fill="#9BA0AB" font-size="11" font-weight="400">metrics</text>

    <rect x="860" y="960" width="230" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="975" y="992" fill="#FAFAFA">structlog</text>
    <text x="975" y="1012" fill="#9BA0AB" font-size="11" font-weight="400">JSON logs</text>

    <rect x="1110" y="960" width="230" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="1225" y="992" fill="#FAFAFA">Dashboards</text>
    <text x="1225" y="1012" fill="#9BA0AB" font-size="11" font-weight="400">ROI + Deflection</text>

    <rect x="1360" y="960" width="160" height="70" rx="10" fill="#262730" stroke="#3D4048"/>
    <text x="1440" y="992" fill="#FAFAFA">Slack</text>
    <text x="1440" y="1012" fill="#9BA0AB" font-size="11" font-weight="400">HITL approvals</text>
  </g>

  <!-- Footer -->
  <text x="800" y="1090" fill="#4B5563" font-size="11" text-anchor="middle">FastAPI · RabbitMQ · Gemini 2.5 Flash · pgvector · Streamlit · Docker</text>
</svg>